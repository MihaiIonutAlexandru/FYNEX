<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bewerbung erhalten | FYNEX GmbH</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;

            background: #0b0b0b;
            color: #fff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            text-align: center;
        }

        .success-box {
            width: min(600px, 100%);

            padding: 60px 35px;

            background: #151515;

            border: 1px solid #333;
        }

        .check {
            width: 70px;
            height: 70px;

            margin: 0 auto 30px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #fff;
            color: #000;

            font-size: 35px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        p {
            color: #aaa;
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 35px;
        }

        a {
            display: inline-flex;

            min-height: 52px;
            padding: 0 25px;

            align-items: center;
            justify-content: center;

            background: #fff;
            color: #000;

            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            background: #ddd;
        }

        @media (max-width: 600px) {

            .success-box {
                padding: 45px 25px;
            }

            h1 {
                font-size: 32px;
            }

            p {
                font-size: 15px;
            }

        }

    </style>

</head>

<body>

    <div class="success-box">

        <div class="check">
            ✓
        </div>

        <h1>
            Vielen Dank!
        </h1>

        <p>
            Ihre Bewerbung wurde erfolgreich
            übermittelt. Wir haben Ihre Unterlagen
            erhalten und werden uns schnellstmöglich
            bei Ihnen melden.
        </p>

        <a href="index.html">
            Zurück zur Startseite
        </a>

    </div>

</body>

</html>
